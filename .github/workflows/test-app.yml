name: Test Single App

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Select app to build"
        required: true
        type: choice
        options:
          - picsart
          - batteryguru
          - kinemaster
          - vn
          - 1111
          - instagram
          - pinterest
          - plus-messenger
          - sdmaidse
          - truecaller
          - ufovpn
          - moviebox
          - gboard

      arch:
        description: "Architecture"
        required: true
        type: choice
        options:
          - arm64-v8a
          - universal
          - armeabi-v7a

jobs:
  build:
    name: Build ${{ inputs.app_name }} (${{ inputs.arch }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install requests beautifulsoup4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Apkeep
        run: |
          curl -fsSL \
            https://github.com/EFForg/apkeep/releases/download/1.0.0/apkeep-x86_64-unknown-linux-gnu \
            -o /usr/local/bin/apkeep
          chmod +x /usr/local/bin/apkeep
          apkeep --version

      - name: Resolve App Configuration
        env:
          APP_NAME: ${{ inputs.app_name }}
          ARCH: ${{ inputs.arch }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          app = os.environ["APP_NAME"]
          arch = os.environ["ARCH"]

          with open("arch-config.json") as f:
              configs = json.load(f)

          matches = [x for x in configs if x["app_name"] == app]

          if not matches:
              print(f"ERROR: {app} not found in arch-config.json")
              sys.exit(1)

          config = matches[0]

          if arch not in config["arches"]:
              print(
                  f"ERROR: {app} does not support {arch}. "
                  f"Supported: {', '.join(config['arches'])}"
              )
              sys.exit(1)

          print(f"APP_NAME={app}")
          print(f"SOURCE={config['source']}")
          print(f"ARCH={arch}")

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"APP_NAME={app}\n")
              env.write(f"SOURCE={config['source']}\n")
              env.write(f"ARCH={arch}\n")
          PY

      - name: Start Trawl
        run: |
          docker run -d \
            --name trawl \
            --network host \
            --shm-size=1g \
            -e MITM_ENABLED=true \
            -e MITM_HOST=127.0.0.1 \
            -e MITM_PORT=8192 \
            -e MITM_DEBUG=true \
            ghcr.io/germondai/trawl:latest

      - name: Wait for Trawl
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8191/health >/dev/null 2>&1; then
              echo "Trawl is ready"
              exit 0
            fi
            sleep 2
          done

          echo "Trawl failed to become ready"
          docker logs trawl || true
          exit 1

      - name: Build APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRAWL_URL: http://localhost:8191
          TRAWL_PROXY: http://localhost:8192
        run: |
          echo "========================================"
          echo "App:    $APP_NAME"
          echo "Source: $SOURCE"
          echo "Arch:   $ARCH"
          echo "========================================"

          python -m src

      - name: Show Build Output
        if: always()
        run: |
          echo "=== APK files ==="
          find . -maxdepth 2 -type f \
            \( -name "*.apk" -o -name "*.xapk" -o -name "*.apkm" -o -name "*.apks" \) \
            -printf '%p %s bytes\n' 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-${{ inputs.arch }}-test
          path: |
            *.apk
            *.xapk
            *.apkm
            *.apks
          if-no-files-found: warn

      - name: Trawl Logs
        if: always()
        run: |
          docker logs trawl 2>&1 | tail -300 || true

      - name: Cleanup Trawl
        if: always()
        run: |
          docker rm -f trawl 2>/dev/null || true
